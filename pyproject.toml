[project]
name = "withings-aura-server"
version = "0.2.0"
description = "Local HTTP server and web UI to control a Withings Aura (WSD01)"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio", "ruff"]

[project.scripts]
withings-aura = "withings_aura.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["withings_aura*"]

[tool.setuptools.package-data]
withings_aura = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
